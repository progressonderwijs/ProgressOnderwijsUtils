version: build-{build}
branches:
  only:
  - master
image: Visual Studio 2022
# The VS2022 image ships with SDKs up to 9.x; install .NET 10 SDK on top.
install:
- ps: |
    Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -UseBasicParsing -OutFile "$env:TEMP\dotnet-install.ps1"
    & "$env:TEMP\dotnet-install.ps1" -Channel 11.0 -Quality GA -InstallDir "$env:ProgramFiles\dotnet"
    $env:PATH = "$env:ProgramFiles\dotnet;$env:PATH"
before_build:
  - cmd: dotnet --version
environment:
  CONNECTION_STRING: Server=(local)\SQL2019;Database=master;User ID=sa;Password=Password12!;Encrypt=False
init:
- net start MSSQL$SQL2019
build_script:
- cmd: dotnet build -c Release
- cmd: dotnet pack -c Release --include-symbols --include-source
test_script:
- cmd: dotnet run --project test/ProgressOnderwijsUtils.Tests -c Release
- cmd: dotnet run --project test/ProgressOnderwijsUtils.Analyzers.Tests -c Release
artifacts:
- path: '**\*.nupkg'
deploy:
- provider: NuGet
  api_key:
    # to regenerate, log in to https://www.nuget.org/packages/ProgressOnderwijsUtils/ as ProgressOnderwijs, navigate to https://www.nuget.org/account/apikeys?forceApiKeys=true and (re)generate the key
    # login to appveyor with your github account, and select the progressonderwijs persona (https://ci.appveyor.com/account/progressonderwijs) in the leftmost column to act on behalf of the org, not yourself.
    # Encrypt the nuget key using the appveyor tool: https://ci.appveyor.com/account/progressonderwijs/tools/encrypt
    secure: HsBWdJ1g94CeY3JdWw/MITKXipnOlpzMBSwTCNLolCXU3qk1sEbjaCcsMhCBDTFk
  on:
    branch: master
